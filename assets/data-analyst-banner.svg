<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Yuvashankar. Data analytics and business intelligence. From questions to decisions.">
<style>
  /* Lightweight, self-contained README animation; no JavaScript or external assets. */
  .bar-rise { transform-box: fill-box; transform-origin: center bottom; animation: barBreath 6s ease-in-out infinite; }
  .bars rect:nth-child(2) { animation-delay: -.8s; }
  .bars rect:nth-child(3) { animation-delay: -1.8s; }
  .bars rect:nth-child(4) { animation-delay: -3s; }
  .bars rect:nth-child(5) { animation-delay: -2.1s; }
  .bars rect:nth-child(6) { animation-delay: -4.2s; }
  .bars rect:nth-child(7) { animation-delay: -2.7s; }
  .chart-flow { stroke-dasharray: 4 18; animation: chartDash 5s linear infinite; }
  .orb-one { animation: orbPulse 7s ease-in-out infinite; }
  .orb-two { animation: orbPulse 9s ease-in-out -4s infinite; }
  .live-indicator { animation: livePulse 2.2s ease-in-out infinite; }
  .cursor { animation: livePulse 1.4s step-end infinite; }
  .graph-node { transform-box: fill-box; transform-origin: center; animation: nodeBeat 5s ease-in-out infinite; }
  .graph-node:nth-child(2n) { animation-delay: -2.5s; }
  .graph-node:nth-child(3n) { animation-delay: -1.2s; }
  @keyframes chartDash { to { stroke-dashoffset: -220; } }
  @keyframes barBreath { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.82); } }
  @keyframes orbPulse { 0%,100% { opacity: .17; } 50% { opacity: .29; } }
  @keyframes livePulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes nodeBeat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.24); } }

  .grid-shift { animation: gridPan 27s linear infinite; }
  .shimmer-title { animation: titleBloom 8s ease-in-out infinite; }
  .accent-wipe { transform-origin: 0% 50%; animation: wipe 5s cubic-bezier(.4,0,.2,1) infinite; }
  .dash-glint { animation: glint 5s linear infinite; }
  .scan { animation: scanLeft 9s ease-in-out infinite; }
  .orbit { transform-box: fill-box; transform-origin: center; animation: spin 18s linear infinite; }
  .orbit-reverse { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite reverse; }
  .float-card { animation: floatY 7s ease-in-out infinite; }
  .spark { animation: sparkle 4s ease-in-out infinite; }
  .spark:nth-of-type(2n) { animation-delay: -2s; }
  .spark:nth-of-type(3n) { animation-delay: -3s; }
  .data-stream { stroke-dasharray: 3 13; animation: chartDash 12s linear infinite; }
  .metric-pulse { animation: metricBright 6s ease-in-out infinite; }
  .gradient-glow { animation: gradientShift 16s ease-in-out infinite; }
  .tiny-dot { animation: livePulse 3s ease-in-out infinite; }
  @keyframes gridPan { from { transform: translate(0,0); } to { transform: translate(36px,36px); } }
  @keyframes titleBloom { 0%,100% { opacity: 1; } 50% { opacity: .88; } }
  @keyframes wipe { 0%,10% { transform:scaleX(.18); } 45%,85% { transform:scaleX(1); } 100% { transform:scaleX(.18); } }
  @keyframes glint { 0%,15% { opacity:0; } 30% { opacity:.9; } 45%,100% { opacity:0; } }
  @keyframes scanLeft { 0%,12% { transform:translateX(-20px); opacity:0; } 25% { opacity:.65; } 65% { opacity:.65; } 85%,100% { transform:translateX(280px); opacity:0; } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes floatY { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
  @keyframes sparkle { 0%,100% { opacity:.13; transform:scale(.8); } 47% { opacity:.9; transform:scale(1.17); } }
  @keyframes metricBright { 0%,100% { fill:#75EDD8; } 50% { fill:#FFFFFF; } }
  @keyframes gradientShift { 0%,100% { opacity:.2; } 50% { opacity:.36; } }

  @media (prefers-reduced-motion: reduce) {
    .grid-shift,.shimmer-title,.accent-wipe,.dash-glint,.scan,.orbit,.orbit-reverse,.float-card,.spark,.data-stream,.metric-pulse,.gradient-glow,.tiny-dot { animation: none !important; }
    .scan,.dash-glint { display:none; }

    .bar-rise,.chart-flow,.orb-one,.orb-two,.live-indicator,.cursor,.graph-node { animation: none !important; }
    .moving-point { display:none; }
  }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11204C"/>
      <stop offset="48%" stop-color="#35328B"/>
      <stop offset="100%" stop-color="#17588B"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#5CE4C6"/><stop offset="55%" stop-color="#7CCBFF"/><stop offset="100%" stop-color="#F8A8E3"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#24B8A7"/><stop offset="100%" stop-color="#8FF0DF"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#FFF" stroke-opacity=".065" stroke-width="1"/>
    </pattern>
    <clipPath id="rounded"><rect width="1200" height="360" rx="24"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="48"/></filter>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect class="grid-shift" x="-36" y="-36" width="1272" height="432" fill="url(#grid)"/>
    <g opacity=".34" fill="none" stroke="#72D8F1" stroke-width="1.6" stroke-linecap="round">
      <path class="data-stream" d="M 440 6 C 540 76, 615 18, 760 74" />
      <path class="data-stream" d="M 450 337 C 590 276, 665 376, 760 279" />
      <path class="data-stream" d="M 690 18 L 761 82" />
    </g>
    <g fill="#D3FFF6">
      <circle class="spark" cx="495" cy="59" r="3.1"/>
      <circle class="spark" cx="565" cy="115" r="2.3"/>
      <circle class="spark" cx="641" cy="38" r="2.7"/>
      <circle class="spark" cx="725" cy="137" r="3"/>
      <circle class="spark" cx="602" cy="295" r="2.7"/>
      <circle class="spark" cx="483" cy="277" r="2.1"/>
      <circle class="spark" cx="719" cy="332" r="2.2"/>
      <circle class="spark" cx="1089" cy="334" r="2.7"/>
    </g>
    <circle class="orb-one gradient-glow" cx="1072" cy="20" r="165" fill="#7C6CFF" opacity=".22" filter="url(#glow)"/>
    <circle class="orb-two gradient-glow" cx="714" cy="339" r="150" fill="#25E7CE" opacity=".18" filter="url(#glow)"/>
    <circle cx="50" cy="350" r="180" fill="#C47AFE" opacity=".13" filter="url(#glow)"/>
    <g font-family="Segoe UI, Arial, sans-serif">
      <rect x="58" y="51" width="293" height="33" rx="16.5" fill="#FFFFFF" fill-opacity=".11" stroke="#FFFFFF" stroke-opacity=".24"/>
      <circle class="live-indicator" cx="77" cy="67.5" r="4.5" fill="#6EF4D2"/>
      <text x="92" y="73" font-size="14" font-weight="650" letter-spacing="1.8" fill="#DDF8FF">DATA ANALYTICS  •  BI</text>
      <text class="shimmer-title" x="57" y="170" font-size="70" font-weight="750" letter-spacing="-2" fill="#FFFFFF">Yuvashankar</text>
      <rect class="accent-wipe" x="59" y="188" width="67" height="5" rx="2.5" fill="#70EDCC"/>
      <rect class="accent-wipe" x="134" y="188" width="34" height="5" rx="2.5" fill="#FDB3DC"/>
      <text x="59" y="238" font-size="28" font-weight="550" fill="#E6EDFF">From questions to</text>
      <text x="59" y="274" font-size="31" font-weight="750" fill="#7FF1D4">better decisions.</text>
      <text x="60" y="319" font-size="15" letter-spacing=".75" fill="#C8D4F7">PYTHON  /  SQL  /  BUSINESS INSIGHTS  /  DATA STORYTELLING</text>
    </g>
    <g transform="translate(770 48)">
      <g class="float-card">
        <rect x="172" y="-16" width="109" height="25" rx="12.5" fill="#172D59" stroke="#85E7D7" stroke-opacity=".62"/>
        <circle class="tiny-dot" cx="190" cy="-3.5" r="4.5" fill="#84F5CF"/>
        <text x="204" y="2" font-size="11" font-family="Segoe UI,Arial,sans-serif" letter-spacing="1.1" font-weight="700" fill="#DDF9FF">LIVE DATA</text>
      </g>
      <rect x="0" y="0" width="380" height="263" rx="23" fill="#FFFFFF" fill-opacity=".09" stroke="#FFFFFF" stroke-opacity=".22"/>
      <rect x="21" y="20" width="338" height="221" rx="16" fill="#071B44" fill-opacity=".25" stroke="#FFFFFF" stroke-opacity=".12"/>
      <g font-family="Segoe UI, Arial, sans-serif">
        <circle cx="41" cy="43" r="5" fill="#F9ADC9"/><circle cx="59" cy="43" r="5" fill="#F7D87E"/><circle cx="77" cy="43" r="5" fill="#70E8CF"/>
        <text x="290" y="48" font-size="13" fill="#C4D9F4" font-weight="600" letter-spacing="1">INSIGHTS</text>
      </g>
      <g opacity=".13" stroke="#FFFFFF" stroke-width="1">
        <path d="M44 99H340M44 141H340M44 183H340M44 225H340"/>
      </g>
      <defs>
        <linearGradient id="scanGlow" x1="0" x2="1">
          <stop offset="0%" stop-color="#93FFF1" stop-opacity="0"/>
          <stop offset="50%" stop-color="#BAF8FF" stop-opacity=".17"/>
          <stop offset="100%" stop-color="#93FFF1" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <rect class="scan" x="43" y="66" width="75" height="161" fill="url(#scanGlow)"/>
      <g class="bars" fill="url(#bar)">
        <rect class="bar-rise" x="54" y="172" width="28" height="54" rx="6" opacity=".69"/>
        <rect class="bar-rise" x="97" y="150" width="28" height="76" rx="6" opacity=".76"/>
        <rect class="bar-rise" x="140" y="168" width="28" height="58" rx="6" opacity=".65"/>
        <rect class="bar-rise" x="183" y="128" width="28" height="98" rx="6" opacity=".83"/>
        <rect class="bar-rise" x="226" y="112" width="28" height="114" rx="6" opacity=".95"/>
        <rect class="bar-rise" x="269" y="136" width="28" height="90" rx="6" opacity=".84"/>
        <rect class="bar-rise" x="312" y="83" width="28" height="143" rx="6"/>
      </g>
      <polyline points="68,143 111,119 154,134 197,95 240,101 283,70 326,63" fill="none" stroke="url(#flow)" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round"/>
      <polyline class="chart-flow" points="68,143 111,119 154,134 197,95 240,101 283,70 326,63" fill="none" stroke="#E8FFFF" stroke-opacity=".9" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="moving-point" cx="0" cy="0" r="5.7" fill="#FFFFFF" stroke="#6DF6DF" stroke-width="3">
        <animateMotion dur="7s" repeatCount="indefinite" path="M68 143 L111 119 L154 134 L197 95 L240 101 L283 70 L326 63" />
      </circle>
      <g fill="#FFFFFF" stroke="#7EEFD5" stroke-width="3">
        <circle class="graph-node" cx="68" cy="143" r="4.5"/><circle class="graph-node" cx="111" cy="119" r="4.5"/><circle class="graph-node" cx="154" cy="134" r="4.5"/><circle class="graph-node" cx="197" cy="95" r="4.5"/><circle class="graph-node" cx="240" cy="101" r="4.5"/><circle class="graph-node" cx="283" cy="70" r="4.5"/><circle class="graph-node" cx="326" cy="63" r="4.5"/>
      </g>
      <g opacity=".7" fill="none" stroke-linecap="round" stroke-width="1.6">
        <circle class="orbit" cx="319" cy="64" r="15" stroke="#A5FFF0" stroke-dasharray="17 17"/>
        <circle class="orbit-reverse" cx="319" cy="64" r="23" stroke="#C7B2FF" stroke-opacity=".68" stroke-dasharray="8 23"/>
      </g>
      <g font-family="Segoe UI,Arial,sans-serif" class="float-card">
        <rect x="35" y="246" width="136" height="30" rx="15" fill="#182E66" stroke="#FFFFFF" stroke-opacity=".27"/>
        <text x="51" y="265" fill="#D8E8FB" font-size="12" font-weight="600">INSIGHT ENGINE</text>
        <circle class="metric-pulse" cx="154" cy="261" r="4"/>
      </g>
    </g>
  </g>
</svg>